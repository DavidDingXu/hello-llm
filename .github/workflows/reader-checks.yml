name: Reader checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: First lesson without third-party imports
        run: python -S -m lessons.l01
      - name: Install course dependencies
        run: python -m pip install -r ../requirements-site.txt -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Build reading pages
        run: python visuals/build_reading.py
      - name: Reader links
        run: python visuals/check_reader_links.py
      - name: Model, data and exercise checks
        run: python -m unittest discover -s checks -v
      - name: Complete pretraining, SFT and generation
        run: python -m tiny_lm.train --out artifacts/ci_run
      - name: Replay the completed run from its snapshot
        run: python -m lessons.training_replay --run artifacts/ci_run --out artifacts/ci_replay.json
      - name: Independent task and checkpoint reload
        run: python -m lessons.transfer_challenge --module exercises.transfer_solution --train --out artifacts/ci_transfer --steps 100
