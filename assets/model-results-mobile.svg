<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-label="同一个小模型的真实续写与问答输出"><rect width="100%" height="100%" rx="18" fill="#f6f8fa"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="49" font-size="26" fill="#566660">同一个模型，两段训练后的实际输出</text><rect x="48" y="84" width="664" height="274" rx="12" fill="white" stroke="#d2ded7"/><text x="76" y="128" font-size="29" font-weight="600" fill="#23322a">预训练 → 接着写</text><path d="M76 149H684" stroke="#e4ebe7"/><text x="76" y="195" font-size="24" fill="#61716a">输入</text><text x="160" y="195" font-size="30" fill="#3267a4">早上，小丁喜欢</text><text x="76" y="306" font-size="24" fill="#61716a">生成</text><text x="160" y="306" font-size="38" font-weight="600" fill="#277548">红色的苹果。</text><rect x="48" y="390" width="664" height="274" rx="12" fill="white" stroke="#d2ded7"/><text x="76" y="434" font-size="29" font-weight="600" fill="#23322a">问答微调 → 接着答</text><path d="M76 455H684" stroke="#e4ebe7"/><text x="76" y="501" font-size="24" fill="#61716a">输入</text><text x="160" y="501" font-size="30" fill="#3267a4">问：小丁喜欢什么水果？</text><text x="160" y="540" font-size="30" fill="#3267a4">答：</text><text x="76" y="612" font-size="24" fill="#61716a">生成</text><text x="160" y="612" font-size="38" font-weight="600" fill="#277548">红色的苹果。</text><text x="48" y="730" font-size="24" fill="#61716a">换一种问法仍可能答错；教程会带你检查成功与失败。</text></g></svg>