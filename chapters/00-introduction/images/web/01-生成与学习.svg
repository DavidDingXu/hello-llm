<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="822.2" viewBox="0 0 1504 822.2" role="img" aria-label="一句话，怎样接着写出来？" data-web-layout="two-panels" data-source-viewbox="0 0 720 1290"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B"/></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4"/></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5"/></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79"/></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7"/></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9"/></marker></defs><rect width="1504" height="822.2" fill="white"/><g font-family="'Hiragino Sans GB','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">一句话，怎样接着写出来？</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">候选只画三项；实际词表有79项。</text><text x="1468" y="60" fill="#606C7B" font-size="24" text-anchor="end">从左向右阅读 ① → ②</text><g transform="translate(0,54)"><text x="36" y="174" fill="#187B79" font-size="36" font-weight="600" text-anchor="start">生成：选中的字，接回输入</text><rect x="85" y="220" width="505" height="76" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2"/><text x="337.5" y="270.24" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">早上，小丁喜欢</text><path d="M337 301 L337 340" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><rect x="137" y="350" width="400" height="86" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2"/><text x="337.0" y="405.24" fill="#8056A5" font-size="36" font-weight="400" text-anchor="middle">模型 · 参数固定</text><path d="M337 441 L337 479" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><rect x="137" y="490" width="124" height="72" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2"/><text x="199.0" y="538.92" fill="#187B79" font-size="38" font-weight="400" text-anchor="middle">红</text><rect x="279" y="490" width="124" height="72" rx="12" fill="#FFFFFF" stroke="#C5CDD7" stroke-width="2"/><text x="341.0" y="538.92" fill="#C5CDD7" font-size="38" font-weight="400" text-anchor="middle">黄</text><rect x="421" y="490" width="124" height="72" rx="12" fill="#FFFFFF" stroke="#C5CDD7" stroke-width="2"/><text x="483.0" y="538.92" fill="#C5CDD7" font-size="38" font-weight="400" text-anchor="middle">…</text><text x="337" y="604" fill="#606C7B" font-size="32" font-weight="400" text-anchor="middle">给候选算分，这次选中“红”</text><path d="M337 619 L337 651" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)"/><rect x="85" y="663" width="505" height="76" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2"/><text x="337.5" y="713.24" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">早上，小丁喜欢红</text><path d="M596 701 H650 V258 H599" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)"/><text x="610" y="462" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">再</text><text x="610" y="504" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">算</text><text x="610" y="546" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">一</text><text x="610" y="588" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">次</text></g><text x="36" y="157" fill="#187B79" font-size="28" font-weight="600">①</text><g transform="translate(784,-563.2)"><path d="M36 788 L684 788" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="36" y="852" fill="#8056A5" font-size="36" font-weight="600" text-anchor="start">训练：已知答案，用错误调参数</text><rect x="48" y="904" width="286" height="76" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2"/><text x="191.0" y="952.2" fill="#3267A4" font-size="30" font-weight="400" text-anchor="middle">早上，小丁喜欢</text><rect x="412" y="904" width="260" height="76" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2"/><text x="542.0" y="952.2" fill="#3267A4" font-size="30" font-weight="400" text-anchor="middle">已知下一字：红</text><path d="M191 985 L191 1024" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><path d="M542 985 L542 1024" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><rect x="48" y="1036" width="286" height="78" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2"/><text x="191.0" y="1086.56" fill="#8056A5" font-size="34" font-weight="400" text-anchor="middle">模型算出预测</text><rect x="412" y="1036" width="260" height="78" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2"/><text x="542.0" y="1086.56" fill="#187B79" font-size="34" font-weight="400" text-anchor="middle">计算错误</text><path d="M339 1075 L400 1075" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)"/><path d="M542 1120 V1180 H191 V1126" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)"/><text x="366" y="1235" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">沿计算找影响，调整模型里的数</text></g><text x="820" y="157" fill="#187B79" font-size="28" font-weight="600">②</text><line x1="752" y1="140" x2="752" y2="802.2" stroke="#DDE2E8" stroke-width="1"/></g></svg>