<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" role="img" aria-label="One output becomes the next input" lang="en"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="context-stroke" stroke-width="1.5" /></marker></defs><style>text{font-family:Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-variant-numeric:tabular-nums}.math{font-weight:400;font-variant-numeric:tabular-nums}</style><rect width="1080" height="900" fill="#FFFFFF" /><g transform="scale(1.5)"><text x="30" y="56" text-anchor="start" fill="#222A35" font-size="36" font-weight="500">One output becomes the next input</text><text x="30" y="110" text-anchor="start" fill="#222A35" font-size="36" font-weight="400">Neuron 1: input [2, 1]</text><rect x="30" y="135" width="660" height="135" rx="8" fill="#FFF" stroke="#222A35" stroke-width="2.2" /><text class="math" x="360" y="195" text-anchor="middle" fill="#222A35" font-size="38">2×1 + 1×3 + (-1) = 4</text><text x="360" y="248" text-anchor="middle" fill="#187B79" font-size="36" font-weight="400">After ReLU: 4</text><path d="M360 290 V350" fill="none" stroke="#187B79" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="400" y="334" text-anchor="start" fill="#187B79" font-size="36" font-weight="400">Read 4</text><text x="30" y="402" text-anchor="start" fill="#222A35" font-size="36" font-weight="400">Neuron 2: input [4]</text><rect x="30" y="430" width="660" height="135" rx="8" fill="#FFF" stroke="#222A35" stroke-width="2.2" /><text class="math" x="360" y="490" text-anchor="middle" fill="#222A35" font-size="42">4 × 0.5 + 1 = 3</text><text x="360" y="543" text-anchor="middle" fill="#187B79" font-size="36" font-weight="400">After ReLU: 3</text></g></svg>