<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 720 1280" role="img" aria-label="多放一份样本，参数仍共用"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B"/></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4"/></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5"/></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79"/></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7"/></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9"/></marker></defs><rect width="720" height="1280" fill="white"/><g font-family="'Hiragino Sans GB','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">多放一份样本，参数仍共用</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">行列的位置与轴名一起读</text><text x="36" y="180" fill="#3267A4" font-size="36" font-weight="600" text-anchor="start">X：样本按行放</text><text x="235" y="232" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">输入 1</text><text x="365" y="232" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">输入 2</text><text x="36" y="292" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">样本 1</text><text x="36" y="374" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">样本 2</text><rect x="170" y="254" width="125" height="77" rx="4" fill="#EDF3FA" stroke="none" stroke-width="2"/><text x="233.0" y="304.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">2</text><rect x="300" y="254" width="125" height="77" rx="4" fill="#EDF3FA" stroke="none" stroke-width="2"/><text x="363.0" y="304.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><rect x="170" y="336" width="125" height="77" rx="4" fill="#EDF3FA" stroke="none" stroke-width="2"/><text x="233.0" y="386.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text><rect x="300" y="336" width="125" height="77" rx="4" fill="#EDF3FA" stroke="none" stroke-width="2"/><text x="363.0" y="386.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><text x="490" y="294" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">[B,D]</text><text x="36" y="480" fill="#8056A5" font-size="36" font-weight="600" text-anchor="start">W.T：每列对应一项输出</text><text x="235" y="532" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">输出 1</text><text x="365" y="532" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">输出 2</text><text x="36" y="592" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">输入 1</text><text x="36" y="674" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">输入 2</text><rect x="170" y="554" width="125" height="77" rx="4" fill="#F3EEF8" stroke="none" stroke-width="2"/><text x="233.0" y="604.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><rect x="300" y="554" width="125" height="77" rx="4" fill="#F3EEF8" stroke="none" stroke-width="2"/><text x="363.0" y="604.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">3</text><rect x="170" y="636" width="125" height="77" rx="4" fill="#F3EEF8" stroke="none" stroke-width="2"/><text x="233.0" y="686.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">2</text><rect x="300" y="636" width="125" height="77" rx="4" fill="#F3EEF8" stroke="none" stroke-width="2"/><text x="363.0" y="686.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">4</text><text x="490" y="592" fill="#8056A5" font-size="34" font-weight="400" text-anchor="start">[D,O]</text><text x="36" y="798" fill="#222A35" font-size="38" font-weight="600" text-anchor="start">Y = X @ W.T + b</text><text x="36" y="850" fill="#8056A5" font-size="32" font-weight="400" text-anchor="start">同一组 b 加到每一行</text><rect x="450" y="800" width="97" height="69" rx="4" fill="#F3EEF8" stroke="none" stroke-width="2"/><text x="499.0" y="846.16" fill="#222A35" font-size="36" font-weight="400" text-anchor="middle">1</text><rect x="552" y="800" width="97" height="69" rx="4" fill="#F3EEF8" stroke="none" stroke-width="2"/><text x="601.0" y="846.16" fill="#222A35" font-size="36" font-weight="400" text-anchor="middle">-1</text><text x="235" y="948" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">输出 1</text><text x="365" y="948" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">输出 2</text><text x="36" y="1008" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">样本 1</text><text x="36" y="1090" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">样本 2</text><rect x="170" y="970" width="125" height="77" rx="4" fill="#EBF5F3" stroke="none" stroke-width="2"/><text x="233.0" y="1020.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">5</text><rect x="300" y="970" width="125" height="77" rx="4" fill="#EBF5F3" stroke="none" stroke-width="2"/><text x="363.0" y="1020.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">9</text><rect x="170" y="1052" width="125" height="77" rx="4" fill="#EBF5F3" stroke="none" stroke-width="2"/><text x="233.0" y="1102.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">3</text><rect x="300" y="1052" width="125" height="77" rx="4" fill="#EBF5F3" stroke="none" stroke-width="2"/><text x="363.0" y="1102.78" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">3</text><text x="490" y="1010" fill="#187B79" font-size="34" font-weight="400" text-anchor="start">[B,O]</text><text x="36" y="1222" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">B：样本数   D：输入项数   O：输出项数</text></g></svg>