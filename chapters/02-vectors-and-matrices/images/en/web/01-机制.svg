<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="650" viewBox="0 0 1504 650" role="img" aria-label="One weight row produces one output" data-web-layout="reconstructed"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="65" font-size="38" font-weight="600" fill="#222A35">One weight row produces one output</text><text x="36" y="113" font-size="27" fill="#606C7B">Both rows read the same input; neither output feeds the other.</text><rect x="36" y="166" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="56" y="211" font-size="28" fill="#3267A4">Input x</text><text x="56" y="277" font-size="34" font-weight="600" fill="#3267A4">[2, 1]</text><path d="M301 250h22l-6-6m6 6-6 6" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="332" y="166" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="352" y="211" font-size="28" fill="#8056A5">Weight row 1</text><text x="352" y="277" font-size="34" font-weight="600" fill="#8056A5">[1, 2]</text><path d="M597 250h22l-6-6m6 6-6 6" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="628" y="166" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="648" y="211" font-size="28" fill="#222A35">Products</text><text x="648" y="277" font-size="34" font-weight="600" fill="#222A35">[2, 2]</text><path d="M893 250h22l-6-6m6 6-6 6" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="924" y="166" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="944" y="211" font-size="28" fill="#222A35">Sum</text><text x="944" y="277" font-size="34" font-weight="600" fill="#222A35">4</text><path d="M1189 250h22l-6-6m6 6-6 6" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="1220" y="166" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="1240" y="211" font-size="28" fill="#187B79">Bias → output</text><text x="1240" y="277" font-size="34" font-weight="600" fill="#187B79">4 + (1) = 5</text><rect x="36" y="380" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="56" y="425" font-size="28" fill="#3267A4">Input x</text><text x="56" y="491" font-size="34" font-weight="600" fill="#3267A4">[2, 1]</text><path d="M301 464h22l-6-6m6 6-6 6" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="332" y="380" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="352" y="425" font-size="28" fill="#8056A5">Weight row 2</text><text x="352" y="491" font-size="34" font-weight="600" fill="#8056A5">[3, 4]</text><path d="M597 464h22l-6-6m6 6-6 6" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="628" y="380" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="648" y="425" font-size="28" fill="#222A35">Products</text><text x="648" y="491" font-size="34" font-weight="600" fill="#222A35">[6, 4]</text><path d="M893 464h22l-6-6m6 6-6 6" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="924" y="380" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="944" y="425" font-size="28" fill="#222A35">Sum</text><text x="944" y="491" font-size="34" font-weight="600" fill="#222A35">10</text><path d="M1189 464h22l-6-6m6 6-6 6" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="1220" y="380" width="258" height="164" rx="10" fill="#F4F6F9"/><text x="1240" y="425" font-size="28" fill="#187B79">Bias → output</text><text x="1240" y="491" font-size="34" font-weight="600" fill="#187B79">10 + (-1) = 9</text><text x="36" y="620" font-size="27" fill="#187B79">Outputs side by side: [5.0, 9.0]</text></g></svg>