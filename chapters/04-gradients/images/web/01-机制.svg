<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 470" width="1540" height="470" role="img" aria-label="从预测到损失：一次可核对的计算" data-web-layout="overview"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="68" font-size="38" font-weight="600" fill="#222A35">从预测到损失：一次可核对的计算</text><text x="36" y="116" font-size="25" fill="#606C7B">结构概览 · 点击图片可查看完整数值与分支细节</text><rect x="36" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="56" y="219" font-size="24" fill="#3267A4">01</text><text x="56" y="258" font-size="25" font-weight="600" fill="#222A35">输入与参数</text><text x="56" y="305" font-size="22" fill="#606C7B">输入 x，当前权重 w</text><path d="M311 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="336" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="356" y="219" font-size="24" fill="#8056A5">02</text><text x="356" y="258" font-size="25" font-weight="600" fill="#222A35">计算预测</text><text x="356" y="305" font-size="22" fill="#606C7B">使用当前参数前向计算</text><path d="M611 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="636" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="656" y="219" font-size="24" fill="#8056A5">03</text><text x="656" y="258" font-size="25" font-weight="600" fill="#222A35">对照目标</text><text x="656" y="305" font-size="22" fill="#606C7B">预测值 − 目标值</text><path d="M911 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="936" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="956" y="219" font-size="24" fill="#187B79">04</text><text x="956" y="258" font-size="25" font-weight="600" fill="#222A35">计算损失</text><text x="956" y="305" font-size="22" fill="#606C7B">将差值平方</text><path d="M1211 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="1236" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="1256" y="219" font-size="24" fill="#187B79">05</text><text x="1256" y="258" font-size="25" font-weight="600" fill="#222A35">准备更新</text><text x="1256" y="305" font-size="22" fill="#606C7B">根据梯度与学习率调整 w</text><text x="36" y="428" font-size="24" fill="#606C7B">从左向右读计算顺序；需要循环的部分按正文说明返回起点。</text></g></svg>