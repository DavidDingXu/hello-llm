<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1635" viewBox="0 0 720 1090" role="img" aria-label="Hidden values give y=−1 and L=4" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1090" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">Hidden values give y=−1 and L=4</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Fixed inputs and parameters; follow the arrows.</text><rect x="176" y="154" width="368" height="74" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2" /><text x="360.0" y="202.56" fill="#3267A4" font-size="34" font-weight="400" text-anchor="middle">Input [1, 2]</text><path d="M288 240 L186 292" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)" /><path d="M432 240 L534 292" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)" /><text x="186" y="342" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">Weights [1, 0]</text><text x="186" y="398" fill="#222A35" font-size="30" font-weight="400" text-anchor="middle">1×1+2×0+0=1</text><rect x="36" y="438" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="186.0" y="486.88" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">ReLU(1) = 1</text><text x="186" y="568" fill="#187B79" font-size="36" font-weight="400" text-anchor="middle">h₁ = 1</text><path d="M186 590 L304 688" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><text x="136" y="644" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">×(1)</text><text x="534" y="342" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">Weights [0, 1]</text><text x="534" y="398" fill="#222A35" font-size="30" font-weight="400" text-anchor="middle">1×0+2×1+0=2</text><rect x="384" y="438" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="534.0" y="486.88" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">ReLU(2) = 2</text><text x="534" y="568" fill="#187B79" font-size="36" font-weight="400" text-anchor="middle">h₂ = 2</text><path d="M534 590 L416 688" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><text x="584" y="644" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">×(-1)</text><circle cx="360" cy="720" r="48" fill="white" stroke="#187B79" stroke-width="3" /><text x="360" y="733.6" fill="#187B79" font-size="40" font-weight="400" text-anchor="middle">-1</text><text x="360" y="820" fill="#222A35" font-size="32" font-weight="400" text-anchor="middle">Add both branches and output bias 0</text><path d="M360 842 L360 904" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)" /><text x="490" y="894" fill="#222A35" font-size="32" font-weight="400" text-anchor="start">(y−1)²</text><rect x="220" y="925" width="280" height="112" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="360.0" y="963" fill="#187B79" font-size="30" font-weight="400" text-anchor="middle">Loss L</text><text x="360.0" y="1017" fill="#187B79" font-size="40" font-weight="600" text-anchor="middle">4</text></g></svg>