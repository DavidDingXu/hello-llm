y="60" fill="#606C7B" font-size="24" text-anchor="end">从左向右阅读 ① → ②</text><g transform="translate(0,54)"><text x="36" y="174" fill="#222A35" font-size="34" font-weight="400" text-anchor="start">y = h₁ − h₂ + h₁；目标仍为1</text><circle cx="206" cy="276" r="48" fill="white" stroke="#3267A4" stroke-width="3"/><text x="206" y="290.28" fill="#3267A4" font-size="42" font-weight="400" text-anchor="middle">1</text><text x="206" y="216" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">同一个 h₁</text><circle cx="552" cy="276" r="48" fill="white" stroke="#3267A4" stroke-width="3"/><text x="552" y="290.28" fill="#3267A4" font-size="42" font-weight="400" text-anchor="middle">2</text><text x="552" y="216" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">h₂</text><path d="M206 328 L108 399" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)"/><rect x="26" y="414" width="164" height="76" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2"/><text x="108.0" y="464.24" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">+ h₁</text><path d="M108 500 L330 578" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)"/><path d="M206 328 L314 399" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)"/><rect x="232" y="414" width="164" height="76" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2"/><text x="314.0" y="464.24" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">+ h₁</text><path d="M314 500 L330 578" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)"/><rect x="470" y="414" width="164" height="76" rx="12" fill="#FFFFFF" stroke="#222A35" stroke-width="2"/><text x="552.0" y="464.24" fill="#222A35" font-size="36" font-weight="400" text-anchor="middle">− h₂</text><path d="M552 328 L552 399" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)"/><path d="M552 500 L390 578" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><circle cx="360" cy="615" r="42" fill="white" stroke="#187B79" stroke-width="3"/><text x="360" y="628.6" fill="#187B79" font-size="40" font-weight="400" text-anchor="middle">0</text><text x="360" y="704" fill="#187B79" font-size="36" font-weight="400" text-anchor="middle">损失 L = (0−1)² = 1</text></g><text x="36" y="157" fill="#187B79" font-size="28" font-weight="600">①</text><g transform="translate(784,-542.6)"><path d="M36 754 L684 754" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="36" y="816" fill="#B14C70" font-size="36" font-weight="600" text-anchor="start">反向：从 y 收到 −2</text><text x="36" y="872" fill="#606C7B" font-size="32" font-weight="400" text-anchor="start">两个 +h₁ 的局部变化率都是1</text><circle cx="150" cy="974" r="46" fill="white" stroke="#B14C70" stroke-width="3"/><text x="150" y="986.92" fill="#B14C70" font-size="38" font-weight="400" text-anchor="middle">−2</text><path d="M150 1028 L315 1120" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><circle cx="570" cy="974" r="46" fill="white" stroke="#B14C70" stroke-width="3"/><text x="570" y="986.92" fill="#B14C70" font-size="38" font-weight="400" text-anchor="middle">−2</text><path d="M570 1028 L405 1120" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><text x="150" y="914" fill="#B14C70" font-size="30" font-weight="400" text-anchor="middle">第一条路径</text><text x="570" y="914" fill="#B14C70" font-size="30" font-weight="400" text-anchor="middle">第二条路径</text><circle cx="360" cy="1165" r="44" fill="white" stroke="#B14C70" stroke-width="3"/><text x="360" y="1179.28" fill="#B14C70" font-size="42" font-weight="400" text-anchor="middle">+</text><text x="360" y="1262" fill="#B14C70" font-size="36" font-weight="400" text-anchor="middle">dL/dh₁ = −2 + (−2) = −4</text></g><text x="820" y="157" fill="#187B79" font-size="28" font-weight="600">②</text><line x1="752" y1="140" x2="752" y2="781.6" stroke="#DDE2E8" stroke-width="1"/></g></s