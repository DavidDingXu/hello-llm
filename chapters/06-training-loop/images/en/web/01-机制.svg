<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 470" width="1540" height="470" role="img" aria-label="The training loop" data-web-layout="overview"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="68" font-size="38" font-weight="600" fill="#222A35">The training loop</text><text x="36" y="116" font-size="25" fill="#606C7B">Structure overview · Open the original figure for numerical details</text><rect x="36" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="56" y="219" font-size="24" fill="#3267A4">01</text><text x="56" y="258" font-size="25" font-weight="600" fill="#222A35">Batch</text><text x="56" y="305" font-size="22" fill="#606C7B">Keep inputs and targets</text><text x="56" y="332" font-size="22" fill="#606C7B">aligned</text><path d="M311 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="336" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="356" y="219" font-size="24" fill="#8056A5">02</text><text x="356" y="258" font-size="25" font-weight="600" fill="#222A35">Forward and loss</text><text x="356" y="305" font-size="22" fill="#606C7B">Predict, then score</text><path d="M611 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="636" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="656" y="219" font-size="24" fill="#8056A5">03</text><text x="656" y="258" font-size="25" font-weight="600" fill="#222A35">Clear gradients</text><text x="656" y="305" font-size="22" fill="#606C7B">Remove previous</text><text x="656" y="332" font-size="22" fill="#606C7B">contributions</text><path d="M911 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="936" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="956" y="219" font-size="24" fill="#187B79">04</text><text x="956" y="258" font-size="25" font-weight="600" fill="#222A35">Backward</text><text x="956" y="305" font-size="22" fill="#606C7B">Compute this iteration’s</text><text x="956" y="332" font-size="22" fill="#606C7B">gradients</text><path d="M1211 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="1236" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="1256" y="219" font-size="24" fill="#187B79">05</text><text x="1256" y="258" font-size="25" font-weight="600" fill="#222A35">Update</text><text x="1256" y="305" font-size="22" fill="#606C7B">Predict again with new</text><text x="1256" y="332" font-size="22" fill="#606C7B">parameters</text><text x="36" y="428" font-size="24" fill="#606C7B">Read left to right; repeat the loop where the text specifies.</text></g></svg>