<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="758" viewBox="0 0 1504 758" role="img" aria-label="Four targets become sixteen pairs" lang="en" data-web-layout="two-panels" data-source-viewbox="0 0 720 1100"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B"/></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4"/></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5"/></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79"/></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7"/></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9"/></marker></defs><rect width="1504" height="758" fill="white"/><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">Four targets become sixteen pairs</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Example: predictions and targets both [0,1,1,0].</text><text x="1468" y="60" fill="#606C7B" font-size="24" text-anchor="end">Read 1 → 2</text><g transform="translate(0,54)"><text x="36" y="178" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">Columns: 1-D targets treated as one row</text><text x="36" y="232" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">Rows: one prediction each</text><text x="248" y="278" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">0</text><text x="356" y="278" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">1</text><text x="464" y="278" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">1</text><text x="572" y="278" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">0</text><text x="36" y="359" fill="#3267A4" font-size="30" font-weight="400" text-anchor="start">Pred 0=0</text><rect x="198" y="305" width="100" height="84" rx="4" fill="#F4F6F9" stroke="#3267A4" stroke-width="2"/><text x="248" y="361" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text><rect x="306" y="305" width="100" height="84" rx="4" fill="#D6E8E7" stroke="none" stroke-width="2"/><text x="356" y="361" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><rect x="414" y="305" width="100" height="84" rx="4" fill="#D6E8E7" stroke="none" stroke-width="2"/><text x="464" y="361" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><rect x="522" y="305" width="100" height="84" rx="4" fill="#F4F6F9" stroke="none" stroke-width="2"/><text x="572" y="361" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text><text x="36" y="454" fill="#3267A4" font-size="30" font-weight="400" text-anchor="start">Pred 1=1</text><rect x="198" y="400" width="100" height="84" rx="4" fill="#D6E8E7" stroke="none" stroke-width="2"/><text x="248" y="456" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><rect x="306" y="400" width="100" height="84" rx="4" fill="#F4F6F9" stroke="#3267A4" stroke-width="2"/><text x="356" y="456" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text><rect x="414" y="400" width="100" height="84" rx="4" fill="#F4F6F9" stroke="none" stroke-width="2"/><text x="464" y="456" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text><rect x="522" y="400" width="100" height="84" rx="4" fill="#D6E8E7" stroke="none" stroke-width="2"/><text x="572" y="456" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><text x="36" y="549" fill="#3267A4" font-size="30" font-weight="400" text-anchor="start">Pred 2=1</text><rect x="198" y="495" width="100" height="84" rx="4" fill="#D6E8E7" stroke="none" stroke-width="2"/><text x="248" y="551" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><rect x="306" y="495" width="100" height="84" rx="4" fill="#F4F6F9" stroke="none" stroke-width="2"/><text x="356" y="551" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text><rect x="414" y="495" width="100" height="84" rx="4" fill="#F4F6F9" stroke="#3267A4" stroke-width="2"/><text x="464" y="551" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text><rect x="522" y="495" width="100" height="84" rx="4" fill="#D6E8E7" stroke="none" stroke-width="2"/><text x="572" y="551" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><text x="36" y="644" fill="#3267A4" font-size="30" font-weight="400" text-anchor="start">Pred 3=0</text><rect x="198" y="590" width="100" height="84" rx="4" fill="#F4F6F9" stroke="none" stroke-width="2"/><text x="248" y="646" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text><rect x="306" y="590" width="100" height="84" rx="4" fill="#D6E8E7" stroke="none" stroke-width="2"/><text x="356" y="646" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><rect x="414" y="590" width="100" height="84" rx="4" fill="#D6E8E7" stroke="none" stroke-width="2"/><text x="464" y="646" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">1</text><rect x="522" y="590" width="100" height="84" rx="4" fill="#F4F6F9" stroke="#3267A4" stroke-width="2"/><text x="572" y="646" fill="#222A35" font-size="38" font-weight="400" text-anchor="middle">0</text></g><text x="36" y="157" fill="#187B79" font-size="28" font-weight="600">①</text><g transform="translate(784,-499)"><text x="36" y="740" fill="#222A35" font-size="30" font-weight="400" text-anchor="start">Each cell: squared error of that row / column pair</text><text x="36" y="798" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">Blue outline: the four intended pairs</text><path d="M36 840 L684 840" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="36" y="908" fill="#187B79" font-size="38" font-weight="600" text-anchor="start">Wrong pairing: 8 ÷ 16 = 0.5</text><text x="36" y="980" fill="#187B79" font-size="38" font-weight="600" text-anchor="start">Correct pairing: 0 ÷ 4 = 0</text><text x="36" y="1045" fill="#606C7B" font-size="32" font-weight="400" text-anchor="start">Correct predictions, wrongly paired targets</text></g><text x="820" y="157" fill="#187B79" font-size="28" font-weight="600">②</text><line x1="752" y1="140" x2="752" y2="738" stroke="#DDE2E8" stroke-width="1"/></g></svg>