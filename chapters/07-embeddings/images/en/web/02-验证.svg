<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="647.2" viewBox="0 0 1504 647.2" role="img" aria-label="Repeated reads add to one gradient" lang="en" data-web-layout="two-panels" data-source-viewbox="0 0 720 1010"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B"/></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4"/></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5"/></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79"/></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7"/></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9"/></marker></defs><rect width="1504" height="647.2" fill="white"/><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="38.16" font-weight="600" text-anchor="start">Repeated reads add to one gradient</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Example · Table gradients, no ID gradients.</text><text x="1468" y="60" fill="#606C7B" font-size="24" text-anchor="end">Read 1 → 2</text><g transform="translate(0,54)"><text x="36" y="170" fill="#222A35" font-size="32" font-weight="400" text-anchor="start">Input: [2,1,2]. L sums all output entries.</text><text x="36" y="222" fill="#606C7B" font-size="32" font-weight="400" text-anchor="start">Each read contributes a gradient of [1,1].</text><text x="36" y="294" fill="#8056A5" font-size="36" font-weight="600" text-anchor="start">Same table row E[2]</text><rect x="45" y="330" width="240" height="76" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="165.0" y="378.88" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">Pos 0: [1,1]</text><rect x="45" y="456" width="240" height="76" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="165.0" y="504.88" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">Pos 2: [1,1]</text><path d="M300 368 L402 427" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><path d="M300 494 L402 443" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><rect x="420" y="394" width="235" height="86" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="537.5" y="450.6" fill="#B14C70" font-size="40" font-weight="400" text-anchor="middle">[2, 2]</text><text x="420" y="536" fill="#B14C70" font-size="32" font-weight="400" text-anchor="start">Add both paths</text></g><text x="36" y="157" fill="#187B79" font-size="28" font-weight="600">①</text><g transform="translate(784,-386.79999999999995)"><text x="36" y="645" fill="#8056A5" font-size="36" font-weight="600" text-anchor="start">Table row E[1]</text><rect x="45" y="682" width="240" height="76" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="165.0" y="730.88" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">Pos 1: [1,1]</text><path d="M300 720 L405 720" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><rect x="420" y="678" width="235" height="86" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="537.5" y="734.6" fill="#B14C70" font-size="40" font-weight="400" text-anchor="middle">[1, 1]</text><path d="M36 822 L684 822" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="36" y="884" fill="#606C7B" font-size="34" font-weight="400" text-anchor="start">E[0], E[3] are not read</text><text x="36" y="941" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Both gradients: [0,0]</text></g><text x="820" y="157" fill="#187B79" font-size="28" font-weight="600">②</text><line x1="752" y1="140" x2="752" y2="627.2" stroke="#DDE2E8" stroke-width="1"/></g></svg>