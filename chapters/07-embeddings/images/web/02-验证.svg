<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="647.2" viewBox="0 0 1504 647.2" role="img" aria-label="重复读取，梯度回到同一行" data-web-layout="two-panels" data-source-viewbox="0 0 720 1010"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B"/></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4"/></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5"/></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79"/></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7"/></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9"/></marker></defs><rect width="1504" height="647.2" fill="white"/><g font-family="'Hiragino Sans GB','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">重复读取，梯度回到同一行</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">构造示例 · 编号不求导，参数表可求导</text><text x="1468" y="60" fill="#606C7B" font-size="24" text-anchor="end">从左向右阅读 ① → ②</text><g transform="translate(0,54)"><text x="36" y="170" fill="#222A35" font-size="32" font-weight="400" text-anchor="start">输入：[2,1,2]；L 为输出坐标之和</text><text x="36" y="222" fill="#606C7B" font-size="32" font-weight="400" text-anchor="start">每次读取的梯度贡献都是 [1,1]</text><text x="36" y="294" fill="#8056A5" font-size="36" font-weight="600" text-anchor="start">同一参数行 E[2]</text><rect x="45" y="330" width="240" height="76" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="165.0" y="378.88" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">位置0：[1,1]</text><rect x="45" y="456" width="240" height="76" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="165.0" y="504.88" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">位置2：[1,1]</text><path d="M300 368 L402 427" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><path d="M300 494 L402 443" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><rect x="420" y="394" width="235" height="86" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="537.5" y="450.6" fill="#B14C70" font-size="40" font-weight="400" text-anchor="middle">[2, 2]</text><text x="420" y="536" fill="#B14C70" font-size="32" font-weight="400" text-anchor="start">两条路径相加</text></g><text x="36" y="157" fill="#187B79" font-size="28" font-weight="600">①</text><g transform="translate(784,-386.79999999999995)"><text x="36" y="645" fill="#8056A5" font-size="36" font-weight="600" text-anchor="start">参数行 E[1]</text><rect x="45" y="682" width="240" height="76" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="165.0" y="730.88" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">位置1：[1,1]</text><path d="M300 720 L405 720" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><rect x="420" y="678" width="235" height="86" rx="12" fill="