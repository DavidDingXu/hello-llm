<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1935" viewBox="0 0 720 1290" role="img" aria-label="一段接续的概率，沿路径相乘"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B"/></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4"/></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5"/></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79"/></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7"/></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9"/></marker></defs><rect width="720" height="1290" fill="white"/><g font-family="'Hiragino Sans GB','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">一段接续的概率，沿路径相乘</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">构造概率；第二步以已接上“苹”为条件</text><rect x="228" y="164" width="264" height="74" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2"/><text x="360.0" y="213.24" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">已有前文</text><path d="M292 247 L182 365" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)"/><path d="M428 247 L550 365" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><text x="180" y="310" fill="#187B79" font-size="36" font-weight="400" text-anchor="middle">0.5</text><text x="550" y="310" fill="#606C7B" font-size="36" font-weight="400" text-anchor="middle">0.5</text><rect x="62" y="378" width="232" height="74" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2"/><text x="178.0" y="427.24" fill="#187B79" font-size="36" font-weight="400" text-anchor="middle">接“苹”</text><rect x="430" y="378" width="232" height="74" rx="12" fill="#FFFFFF" stroke="#606C7B" stroke-width="2"/><text x="546.0" y="426.56" fill="#606C7B" font-size="34" font-weight="400" text-anchor="middle">接其他项</text><text x="545" y="530" fill="#187B79" font-size="28" font-weight="400" text-anchor="middle">沿“苹”这一支</text><text x="545" y="574" fill="#187B79" font-size="28" font-weight="400" text-anchor="middle">再预测“果”</text><path d="M150 460 L100 602" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)"/><path d="M218 460 L342 602" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><text x="90" y="575" fill="#187B79" font-size="36" font-weight="400" text-anchor="middle">0.25</text><text x="352" y="575" fill="#606C7B" font-size="36" font-weight="400" text-anchor="middle">0.75</text><rect x="25" y="620" width="170" height="74" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2"/><text x="110.0" y="669.24" fill="#187B79" font-size="36" font-weight="400" text-anchor="middle">接“果”</text><rect x="260" y="620" width="220" height="74" rx="12" fill="#FFFFFF" stroke="#606C7B" stroke-width="2"/><text x="370.0" y="668.56" fill="#606C7B" font-size="34" font-weight="400" text-anchor="middle">接其他项</text><text x="110" y="760" fill="#606C7B" font-size="30" font-weight="400" text-anchor="middle">整条路径</text><text x="110" y="810" fill="#187B79" font-size="42" font-weight="600" text-anchor="middle">0.125</text><text x="370" y="760" fill="#606C7B" font-size="30" font-weight="400" text-anchor="middle">另一条路径</text><text x="370" y="810" fill="#606C7B" font-size="42" font-weight="400" text-anchor="middle">0.375</text><path d="M36 852 L684 852" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="36" y="912" fill="#222A35" font-size="36" font-weight="600" text-anchor="start">整段占一半里的四分之一</text><rect x="36" y="956" width="648" height="88" rx="0" fill="#E8EDF3" stroke="none" stroke-width="2"/><rect x="36" y="956" width="324" height="88" rx="0" fill="#C9DBEE" stroke="none" stroke-width="2"/><rect x="36" y="956" width="81" height="88" rx="0" fill="#187B79" stroke="none" stroke-width="2"/><path d="M360 943 L360 1055" fill="none" stroke="#3267A4" stroke-width="3"/><text x="36" y="1107" fill="#187B79" font-size="36" font-weight="400" text-anchor="start">青色：0.5 × 0.25 = 0.125</text><text x="36" y="1180" fill="#222A35" font-size="31" font-weight="400" text-anchor="start">−ln(0.125) = −ln(0.5) − ln(0.25)</text><text x="36" y="1236" fill="#B14C70" font-size="34" font-weight="400" text-anchor="start">整段负对数 = 两步负对数相加</text></g></svg>