 font-weight="600" fill="#222A35">Softmax</text><text x="956" y="305" font-size="22" fill="#606C7B">Normalize allowed positions</text><path d="M1211 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="1236" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="1256" y="219" font-size="24" fill="#187B79">05</text><text x="1256" y="258" font-size="25" font-weight="600" fill="#222A35">Weighted V</text><text x="1256" y="305" font-size="22" fill="#606C7B">Future values contribute</text><text x="1256" y="332" font-size="22" fill="#606C7B">nothing</text><text x="36" y="428" font-size="24" fill="#606C7B">Read left to right; repeat the loop where the text specifies.</text></g></svg>