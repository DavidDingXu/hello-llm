<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2115" viewBox="0 0 720 1410" role="img" aria-label="One set of weights cannot do both" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1410" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">One set of weights cannot do both</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Toy V values; real heads also learn projections.</text><text x="36" y="176" fill="#222A35" font-size="34" font-weight="400" text-anchor="start">Fixed V₀=[1,0], V₁=[0,2]</text><path d="M128 626 L642 626" fill="none" stroke="#222A35" stroke-width="2" marker-end="url(#a-ink)" /><path d="M128 626 L128 250" fill="none" stroke="#222A35" stroke-width="2" marker-end="url(#a-ink)" /><text x="642" y="708" fill="#222A35" font-size="30" font-weight="400" text-anchor="end">Dim 1</text><text x="130" y="253" fill="#222A35" font-size="30" font-weight="400" text-anchor="start">Dim 2</text><path d="M128 301.0 L593 626.0" fill="none" stroke="#3267A4" stroke-width="6" /><circle cx="128" cy="301.0" r="7" fill="white" stroke="#3267A4" stroke-width="3" /><text x="142" y="281.0" fill="#3267A4" font-size="30" font-weight="400" text-anchor="start">[0,2]</text><circle cx="593" cy="626.0" r="7" fill="white" stroke="#3267A4" stroke-width="3" /><text x="587" y="668" fill="#3267A4" font-size="30" font-weight="400" text-anchor="end">[1,0]</text><path d="M500.0 626.0 L500.0 366.0" fill="none" stroke="#8056A5" stroke-width="2" stroke-dasharray="6 6" /><circle cx="500.0" cy="561.0" r="9" fill="white" stroke="#3267A4" stroke-width="3" /><text x="476.0" y="613.0" fill="#3267A4" font-size="30" font-weight="400" text-anchor="end">[0.8,0.4]</text><circle cx="500.0" cy="366.0" r="12" fill="white" stroke="#B14C70" stroke-width="3" /><text x="486.0" y="341.0" fill="#B14C70" font-size="32" font-weight="400" text-anchor="end">Target [0.8,1.6]</text><text x="36" y="747" fill="#3267A4" font-size="36" font-weight="600" text-anchor="start">One weight pair stays on the blue line</text><text x="36" y="805" fill="#222A35" font-size="32" font-weight="400" text-anchor="start">If dim 1 is 0.8, dim 2 must be 0.4</text><path d="M36 848 L684 848" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="36" y="911" fill="#222A35" font-size="36" font-weight="600" text-anchor="start">Each head chooses its own weights</text><text x="36" y="991" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">H0</text><rect x="142" y="956" width="264.0" height="62" rx="0" fill="#3267A4" stroke="none" stroke-width="2" /><rect x="406.0" y="956" width="65.99999999999999" height="62" rx="0" fill="#DCE2E9" stroke="none" stroke-width="2" /><text x="142" y="1067" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">Weights [0.8,0.2]</text><text x="625" y="999" fill="#3267A4" font-size="42" font-weight="600" text-anchor="middle">0.8</text><path d="M492 987 L560 987" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)" /><text x="36" y="1173" fill="#8056A5" font-size="34" font-weight="400" text-anchor="start">H1</text><rect x="142" y="1138" width="66.0" height="62" rx="0" fill="#8056A5" stroke="none" stroke-width="2" /><rect x="208.0" y="1138" width="264.0" height="62" rx="0" fill="#DCE2E9" stroke="none" stroke-width="2" /><text x="142" y="1249" fill="#8056A5" font-size="32" font-weight="400" text-anchor="start">Weights [0.2,0.8]</text><text x="625" y="1181" fill="#8056A5" font-size="42" font-weight="600" text-anchor="middle">1.6</text><path d="M492 1169 L560 1169" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><text x="360" y="1347" fill="#187B79" font-size="40" font-weight="600" text-anchor="middle">Concatenate → [0.8,1.6]</text></g></svg>