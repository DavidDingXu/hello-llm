<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1890" viewBox="0 0 720 1260" role="img" aria-label="Calculate the rotated coordinates" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1260" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">Calculate the rotated coordinates</text><text x="36" y="110" fill="#606C7B" font-size="29.01" font-weight="400" text-anchor="start">Example · A simple rotation, then the actual angle.</text><g data-phase="0"><text x="36" y="176" fill="#606C7B" font-size="32.7" font-weight="400" text-anchor="start">Illustration: quarter turn</text><circle cx="210" cy="402" r="120" fill="white" stroke="#C5CDD7" stroke-width="3" /><path d="M70 402 L360 402" fill="none" stroke="#606C7B" stroke-width="2" marker-end="url(#a-muted)" /><path d="M210 542 L210 252" fill="none" stroke="#606C7B" stroke-width="2" marker-end="url(#a-muted)" /><text x="354" y="437" fill="#606C7B" font-size="30" font-weight="400" text-anchor="middle">x</text><text x="186" y="262" fill="#606C7B" font-size="30" font-weight="400" text-anchor="middle">y</text><text x="188" y="437" fill="#606C7B" font-size="28" font-weight="400" text-anchor="middle">0</text><path d="M210 402 L330.0 402.0" fill="none" stroke="#3267A4" stroke-width="4" marker-end="url(#a-input)" /><text x="36" y="589" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">Original [1,0]</text></g><g data-phase="1"><path d="M210 402 L210.0 282.0" fill="none" stroke="#187B79" stroke-width="4" marker-end="url(#a-output)" /><text x="36" y="648" fill="#187B79" font-size="34" font-weight="400" text-anchor="start">π/2 radians → [0,1]</text></g><g data-phase="2"><text x="392" y="176" fill="#222A35" font-size="34" font-weight="400" text-anchor="start">Actual: position 1</text><circle cx="533" cy="402" r="120" fill="white" stroke="#C5CDD7" stroke-width="3" /><path d="M393 402 L683 402" fill="none" stroke="#606C7B" stroke-width="2" marker-end="url(#a-muted)" /><path d="M533 542 L533 252" fill="none" stroke="#606C7B" stroke-width="2" marker-end="url(#a-muted)" /><text x="677" y="437" fill="#606C7B" font-size="30" font-weight="400" text-anchor="middle">x</text><text x="509" y="262" fill="#606C7B" font-size="30" font-weight="400" text-anchor="middle">y</text><text x="511" y="437" fill="#606C7B" font-size="28" font-weight="400" text-anchor="middle">0</text><path d="M533 402 L653.0 402.0" fill="none" stroke="#3267A4" stroke-width="3" stroke-dasharray="7 6" /><path d="M533 402 L597.8362767041767 301.0234818230524" fill="none" stroke="#187B79" stroke-width="4" marker-end="url(#a-output)" /><path d="M597.8362767041767 301.0234818230524 L597.8362767041767 402" fill="none" stroke="#187B79" stroke-width="2" stroke-dasharray="5 5" /><path d="M533 301.0234818230524 L597.8362767041767 301.0234818230524" fill="none" stroke="#187B79" stroke-width="2" stroke-dasharray="5 5" /><text x="392" y="589" fill="#222A35" font-size="32" font-weight="400" text-anchor="start">Angle = 1 × 1</text><text x="392" y="648" fill="#187B79" font-size="34" font-weight="400" text-anchor="start">= 1 radian</text></g><g data-phase="3"><path d="M36 711 L684 711" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="36" y="776" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">1 radian ≈ 57.3°, not 90°</text><text x="36" y="844" fill="#222A35" font-size="34" font-weight="400" text-anchor="start">a′ = a cosα − b sinα</text><text x="36" y="901" fill="#222A35" font-size="34" font-weight="400" text-anchor="start">b′ = a sinα + b cosα</text><rect x="78" y="962" width="564" height="85" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="360.0" y="1017.42" fill="#187B79" font-size="38" font-weight="400" text-anchor="middle">[0.540302, 0.841471]</text><text x="360" y="1120" fill="#187B79" font-size="34" font-weight="400" text-anchor="middle">Position 1: cos(1), sin(1)</text><text x="360" y="1190" fill="#606C7B" font-size="34" font-weight="400" text-anchor="middle">Rotate Q/K; leave V unchanged.</text></g></g></svg>