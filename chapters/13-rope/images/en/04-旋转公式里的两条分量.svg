<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1725" viewBox="0 0 720 1150" role="img" aria-label="Two arrows explain the rotation" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1150" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">Two arrows explain the rotation</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Example angle: cosα=0.8, sinα=0.6</text><text x="360" y="180" fill="#3267A4" font-size="36" font-weight="400" text-anchor="middle">[2,1] = [2,0] + [0,1]</text><text x="360" y="235" fill="#222A35" font-size="32" font-weight="400" text-anchor="middle">Rotate both components by the same angle</text><path d="M100 625 L670 625" fill="none" stroke="#606C7B" stroke-width="2" marker-end="url(#a-muted)" /><path d="M300 700 L300 275" fill="none" stroke="#606C7B" stroke-width="2" marker-end="url(#a-muted)" /><text x="670" y="710" fill="#606C7B" font-size="29" font-weight="400" text-anchor="end">x coordinate</text><text x="280" y="288" fill="#606C7B" font-size="29" font-weight="400" text-anchor="end">y coordinate</text><text x="282" y="659" fill="#606C7B" font-size="28" font-weight="400" text-anchor="end">0</text><path d="M445 620 L445 630" fill="none" stroke="#606C7B" stroke-width="2" /><text x="445" y="665" fill="#606C7B" font-size="28" font-weight="400" text-anchor="middle">1</text><path d="M295 480 L305 480" fill="none" stroke="#606C7B" stroke-width="2" /><text x="283" y="490" fill="#606C7B" font-size="28" font-weight="400" text-anchor="end">1</text><path d="M590 620 L590 630" fill="none" stroke="#606C7B" stroke-width="2" /><text x="590" y="665" fill="#606C7B" font-size="28" font-weight="400" text-anchor="middle">2</text><path d="M295 335 L305 335" fill="none" stroke="#606C7B" stroke-width="2" /><text x="283" y="345" fill="#606C7B" font-size="28" font-weight="400" text-anchor="end">2</text><path d="M532.0 451.0 L445.0 335.0" fill="none" stroke="#C5CDD7" stroke-width="2" stroke-dasharray="6 6" /><path d="M213.0 509.0 L445.0 335.0" fill="none" stroke="#C5CDD7" stroke-width="2" stroke-dasharray="6 6" /><path d="M300 625 L532.0 451.0" fill="none" stroke="#3267A4" stroke-width="4" marker-end="url(#a-input)" /><path d="M300 625 L213.0 509.0" fill="none" stroke="#222A35" stroke-width="4" marker-end="url(#a-ink)" /><path d="M300 625 L445.0 335.0" fill="none" stroke="#187B79" stroke-width="4" marker-end="url(#a-output)" /><text x="660" y="424" fill="#3267A4" font-size="30" font-weight="400" text-anchor="end">Rotated [2,0]</text><text x="660" y="478" fill="#3267A4" font-size="32" font-weight="400" text-anchor="end">[1.6,1.2]</text><text x="36" y="490" fill="#222A35" font-size="30" font-weight="400" text-anchor="start">Rotated [0,1]</text><text x="36" y="550" fill="#222A35" font-size="32" font-weight="400" text-anchor="start">[−0.6,0.8]</text><text x="465.0" y="323.0" fill="#187B79" font-size="36" font-weight="600" text-anchor="start">[1,2]</text><text x="36" y="747" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Dashed: place one arrow at the tip of the other.</text><path d="M36 780 L684 780" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="36" y="835" fill="#3267A4" font-size="32" font-weight="600" text-anchor="start">From [2,0]</text><text x="36" y="887" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">[2×0.8, 2×0.6] = [1.6,1.2]</text><text x="36" y="960" fill="#222A35" font-size="32" font-weight="600" text-anchor="start">From [0,1]</text><text x="36" y="1012" fill="#222A35" font-size="32" font-weight="400" text-anchor="start">[−1×0.6, 1×0.8] = [−0.6,0.8]</text><text x="36" y="1085" fill="#187B79" font-size="32" font-weight="600" text-anchor="start">Sum: [1.6−0.6, 1.2+0.8] = [1,2]</text></g></svg>