<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 470" width="1540" height="470" role="img" aria-label="完整前向：从字符编号到候选分数" data-web-layout="overview"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="68" font-size="38" font-weight="600" fill="#222A35">完整前向：从字符编号到候选分数</text><text x="36" y="116" font-size="25" fill="#606C7B">结构概览 · 点击图片可查看完整数值与分支细节</text><rect x="36" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="56" y="219" font-size="24" fill="#3267A4">01</text><text x="56" y="258" font-size="25" font-weight="600" fill="#222A35">字符编号</text><text x="56" y="305" font-size="22" fill="#606C7B">按词表编码，保留顺序</text><path d="M311 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="336" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="356" y="219" font-size="24" fill="#8056A5">02</text><text x="356" y="258" font-size="25" font-weight="600" fill="#222A35">Embedding</text><text x="356" y="305" font-size="22" fill="#606C7B">查出每个字符的向量</text><path d="M611 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="636" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="656" y="219" font-size="24" fill="#8056A5">03</text><text x="656" y="258" font-size="25" font-weight="600" fill="#222A35">模型块</text><text x="656" y="305" font-size="22" fill="#606C7B">注意力、前馈与残差</text><path d="M911 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="936" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="956" y="219" font-size="24" fill="#187B79">04</text><text x="956" y="258" font-size="25" font-weight="600" fill="#222A35">末端归一化</text><text x="956" y="305" font-size="22" fill="#606C7B">整理最终位置表示</text><path d="M1211 270h18l-5-5m5 5-5 5" fill="none" stroke="#8F9BA8" stroke-width="2"/><rect x="1236" y="178" width="268" height="180" rx="12" fill="#F4F6F9" stroke="#DDE2E8"/><text x="1256" y="219" font-size="24" fill="#187B79">05</text><text x="1256" y="258" font-size="25" font-weight="600" fill="#222A35">词表投影</text><text x="1256" y="305" font-size="22" fill="#606C7B">每个候选字符得到分数</text><text x="36" y="428" font-size="24" fill="#606C7B">从左向右读计算顺序；需要循环的部分按正文说明返回起点。</text></g></svg>