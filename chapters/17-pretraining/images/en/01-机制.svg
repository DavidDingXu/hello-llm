<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2100" viewBox="0 0 720 1400" role="img" aria-label="One batch triggers one update" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1400" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">One batch triggers one update</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Real run · batch 16 · lr 0.003 · single-thread CPU</text><rect x="36" y="165" width="300" height="110" rx="12" fill="#ECF3FB" stroke="#3267A4" stroke-width="2" /><text x="186.0" y="205" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">Train: 256 texts</text><text x="186.0" y="251" fill="#222A35" font-size="34" font-weight="400" text-anchor="middle">4 templates</text><rect x="384" y="165" width="300" height="110" rx="12" fill="#FAEDF2" stroke="#B14C70" stroke-width="2" /><text x="534.0" y="205" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">Held out: 64 texts</text><text x="534.0" y="251" fill="#222A35" font-size="34" font-weight="400" text-anchor="middle">1 other template</text><path d="M186 275 L186 315 L360 315 L360 350" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)" /><rect x="160" y="360" width="400" height="80" rx="12" fill="#ECF3FB" stroke="#3267A4" stroke-width="2" /><text x="360.0" y="411.56" fill="#3267A4" font-size="34" font-weight="400" text-anchor="middle">Sample 16 texts → x,y</text><path d="M360 440 L360 500" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)" /><rect x="160" y="510" width="400" height="80" rx="12" fill="#F1ECF7" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="561.56" fill="#8056A5" font-size="34" font-weight="400" text-anchor="middle">model(x) → logits</text><path d="M360 590 L360 650" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)" /><rect x="160" y="660" width="400" height="80" rx="12" fill="#F4F6F9" stroke="#222A35" stroke-width="2" /><text x="360.0" y="711.56" fill="#222A35" font-size="29.84" font-weight="400" text-anchor="middle">Mean loss over valid targets</text><path d="M360 740 L360 800" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)" /><rect x="160" y="810" width="400" height="80" rx="12" fill="#FAEDF2" stroke="#B14C70" stroke-width="2" /><text x="360.0" y="861.56" fill="#B14C70" font-size="32.65" font-weight="400" text-anchor="middle">Backward → clip norm ≤1</text><path d="M360 890 L360 950" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)" /><rect x="160" y="960" width="400" height="80" rx="12" fill="#F1ECF7" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="1011.56" fill="#8056A5" font-size="27.51" font-weight="400" text-anchor="middle">AdamW → update parameters</text><path d="M160 1000 L65 1000 L65 550 L150 550" fill="none" stroke="#8056A5" stroke-width="4" marker-end="url(#a-param)" /><text x="90" y="1130" fill="#8056A5" font-size="36" font-weight="400" text-anchor="start">1000 updates</text><rect x="160" y="1190" width="400" height="100" rx="12" fill="#F4F6F9" stroke="#222A35" stroke-width="2" /><text x="360.0" y="1223" fill="#222A35" font-size="30" font-weight="400" text-anchor="middle">Full eval every 50 steps</text><text x="360.0" y="1278" fill="#222A35" font-size="36" font-weight="400" text-anchor="middle">train / val</text><path d="M360 1040 L360 1180" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)" /><path d="M534 275 L665 275 L665 1240 L570 1240" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)" /><text x="360" y="1350" fill="#606C7B" font-size="34" font-weight="400" text-anchor="middle">Evaluation keeps parameters fixed</text></g></svg>