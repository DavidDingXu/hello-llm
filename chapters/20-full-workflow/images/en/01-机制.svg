<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2205" viewBox="0 0 720 1470" role="img" aria-label="Four processes, different changes" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1400" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">Four processes, different changes</text><text x="36" y="110" fill="#606C7B" font-size="29.37" font-weight="400" text-anchor="start">Track forward, backward, update, and generation.</text><text x="36" y="175" fill="#3267A4" font-size="36" font-weight="400" text-anchor="start">1  Forward: inputs become scores</text><text x="36" y="475" fill="#B14C70" font-size="36" font-weight="400" text-anchor="start">2  Backward: loss yields gradients</text><path d="M36 415 L684 415" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="36" y="775" fill="#8056A5" font-size="36" font-weight="400" text-anchor="start">3  Update: the optimizer changes weights</text><path d="M36 715 L684 715" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="36" y="1075" fill="#187B79" font-size="36" font-weight="400" text-anchor="start">4  Generate: fixed weights, longer input</text><path d="M36 1015 L684 1015" fill="none" stroke="#C5CDD7" stroke-width="2" /><rect x="36" y="220" width="180" height="110" rx="12" fill="#ECF3FB" stroke="#3267A4" stroke-width="2" /><text x="126.0" y="260" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">IDs</text><text x="126.0" y="306" fill="#222A35" font-size="30" font-weight="400" text-anchor="middle">[B,T]</text><rect x="270" y="220" width="180" height="110" rx="12" fill="#F4F6F9" stroke="#222A35" stroke-width="2" /><text x="360.0" y="260" fill="#222A35" font-size="32" font-weight="400" text-anchor="middle">States</text><text x="360.0" y="306" fill="#222A35" font-size="30" font-weight="400" text-anchor="middle">[B,T,64]</text><rect x="504" y="220" width="180" height="110" rx="12" fill="#E9F4F1" stroke="#187B79" stroke-width="2" /><text x="594.0" y="260" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">Scores</text><text x="594.0" y="306" fill="#222A35" font-size="30" font-weight="400" text-anchor="middle">[B,T,79]</text><path d="M222 275 L264 275" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)" /><path d="M456 275 L498 275" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><text x="360" y="385" fill="#8056A5" font-size="34" font-weight="400" text-anchor="middle">Use W for computation; leave W unchanged</text><rect x="36" y="520" width="180" height="110" rx="12" fill="#F1ECF7" stroke="#8056A5" stroke-width="2" /><text x="126.0" y="560" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">Weights W</text><text x="126.0" y="606" fill="#222A35" font-size="30.74" font-weight="400" text-anchor="middle">Unchanged</text><rect x="270" y="520" width="180" height="110" rx="12" fill="#FAEDF2" stroke="#B14C70" stroke-width="2" /><text x="360.0" y="560" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">Gradients</text><text x="360.0" y="606" fill="#222A35" font-size="32" font-weight="400" text-anchor="middle">dL/dW</text><rect x="504" y="520" width="180" height="110" rx="12" fill="#FAEDF2" stroke="#B14C70" stroke-width="2" /><text x="594.0" y="560" fill="#B14C70" font-size="32" font-weight="400" text-anchor="middle">Loss</text><text x="594.0" y="606" fill="#222A35" font-size="32" font-weight="400" text-anchor="middle">L</text><path d="M498 575 L456 575" fill="none" stroke="#B14C70" stroke-width="4" marker-end="url(#a-grad)" /><path d="M264 575 L222 575" fill="none" stroke="#B14C70" stroke-width="4" marker-end="url(#a-grad)" /><text x="360" y="685" fill="#B14C70" font-size="34" font-weight="400" text-anchor="middle">Follow the forward dependencies backward</text><rect x="36" y="820" width="210" height="110" rx="12" fill="#F1ECF7" stroke="#8056A5" stroke-width="2" /><text x="141.0" y="860" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">Old weights</text><text x="141.0" y="906" fill="#222A35" font-size="32" font-weight="400" text-anchor="middle">-0.0642789</text><rect x="285" y="820" width="150" height="110" rx="12" fill="#F1ECF7" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="860" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">AdamW</text><text x="360.0" y="906" fill="#222A35" font-size="30" font-weight="400" text-anchor="middle">step()</text><rect x="474" y="820" width="210" height="110" rx="12" fill="#F1ECF7" stroke="#8056A5" stroke-width="2" /><text x="579.0" y="860" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">New weights</text><text x="579.0" y="906" fill="#222A35" font-size="32" font-weight="400" text-anchor="middle">-0.0643255</text><path d="M250 875 L280 875" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><path d="M440 875 L469 875" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><text x="360" y="985" fill="#8056A5" font-size="34" font-weight="400" text-anchor="middle">Gradient + optimizer state → actual update</text><rect x="36" y="1120" width="180" height="110" rx="12" fill="#ECF3FB" stroke="#3267A4" stroke-width="2" /><text x="126.0" y="1160" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">Prefix</text><text x="126.0" y="1206" fill="#222A35" font-size="34" font-weight="400" text-anchor="middle">T tokens</text><rect x="270" y="1120" width="180" height="110" rx="12" fill="#F1ECF7" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="1160" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">Same W</text><text x="360.0" y="1206" fill="#222A35" font-size="34" font-weight="400" text-anchor="middle">Forward</text><rect x="504" y="1120" width="180" height="110" rx="12" fill="#E9F4F1" stroke="#187B79" stroke-width="2" /><text x="594.0" y="1160" fill="#187B79" font-size="28.51" font-weight="400" text-anchor="middle">Select token</text><text x="594.0" y="1206" fill="#222A35" font-size="34" font-weight="400" text-anchor="middle">红</text><path d="M222 1175 L264 1175" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)" /><path d="M456 1175 L498 1175" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><path d="M594 1230 L594 1295 L126 1295 L126 1235" fill="none" stroke="#187B79" stroke-width="4" marker-end="url(#a-output)" /><text x="360" y="1355" fill="#187B79" font-size="34" font-weight="400" text-anchor="middle">Append; next time T+1</text></g><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="0" y="1400" width="720" height="70" fill="white" /><text x="360" y="1443.4" font-size="24" fill="#606C7B" text-anchor="middle">Chinese text is kept from the original example.</text></g></svg>