<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2017" viewBox="0 0 720 1345" role="img" aria-label="One network, two training stages" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1345" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">One network, two training stages</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Each stage reuses the previous saved weights.</text><rect x="130" y="165" width="460" height="85" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="219.06" fill="#8056A5" font-size="28.14" font-weight="400" text-anchor="middle">Random start · 92,352 parameters</text><path d="M360 255 L360 291" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><rect x="36" y="302" width="648" height="210" rx="12" fill="#F4F6F9" stroke="none" stroke-width="2" /><text x="60" y="349" fill="#222A35" font-size="36" font-weight="600" text-anchor="start">Lesson 17 · text pretraining</text><text x="60" y="391" fill="#3267A4" font-size="27.47" font-weight="400" text-anchor="start">256 short texts; score valid next-character targets</text><rect x="60" y="406" width="110" height="58" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="115.0" y="445.88" fill="#187B79" font-size="28.37" font-weight="400" text-anchor="middle">Predict</text><rect x="220" y="406" width="110" height="58" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="275.0" y="445.88" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">Score</text><rect x="380" y="406" width="110" height="58" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="435.0" y="445.88" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">Grad</text><rect x="540" y="406" width="110" height="58" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="595.0" y="445.88" fill="#187B79" font-size="27.4" font-weight="400" text-anchor="middle">Update</text><path d="M175 435 L208 435" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><path d="M335 435 L368 435" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><path d="M495 435 L528 435" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><text x="360" y="503" fill="#606C7B" font-size="27" font-weight="400" text-anchor="middle">Repeat for 1,000 updates</text><path d="M360 517 L360 553" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><rect x="130" y="564" width="460" height="85" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="618.74" fill="#8056A5" font-size="36" font-weight="400" text-anchor="middle">Save pretrained weights</text><path d="M360 654 L360 690" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><rect x="36" y="701" width="648" height="210" rx="12" fill="#F4F6F9" stroke="none" stroke-width="2" /><text x="60" y="748" fill="#222A35" font-size="36" font-weight="600" text-anchor="start">Lesson 19 · supervised fine-tuning</text><text x="60" y="790" fill="#3267A4" font-size="29.25" font-weight="400" text-anchor="start">24 Q&amp;A pairs; score only the answer and EOS</text><rect x="60" y="805" width="110" height="58" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="115.0" y="844.88" fill="#187B79" font-size="28.37" font-weight="400" text-anchor="middle">Predict</text><rect x="220" y="805" width="110" height="58" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="275.0" y="844.88" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">Score</text><rect x="380" y="805" width="110" height="58" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="435.0" y="844.88" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">Grad</text><rect x="540" y="805" width="110" height="58" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="595.0" y="844.88" fill="#187B79" font-size="27.4" font-weight="400" text-anchor="middle">Update</text><path d="M175 834 L208 834" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><path d="M335 834 L368 834" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><path d="M495 834 L528 834" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><text x="360" y="902" fill="#606C7B" font-size="27" font-weight="400" text-anchor="middle">300 more updates; all parameters are updated</text><path d="M360 916 L360 952" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><rect x="130" y="963" width="460" height="85" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="1017.74" fill="#8056A5" font-size="36" font-weight="400" text-anchor="middle">Save fine-tuned weights</text><path d="M36 1090 L684 1090" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="36" y="1145" fill="#187B79" font-size="26.14" font-weight="600" text-anchor="start">Lesson 18 · generate with either set of fixed weights</text><rect x="36" y="1178" width="184" height="68" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2" /><text x="128.0" y="1222.88" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">Context</text><path d="M225 1212 L259 1212" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><rect x="271" y="1178" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="361.0" y="1222.88" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">Next token</text><path d="M456 1212 L490 1212" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><rect x="502" y="1178" width="182" height="68" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2" /><text x="593.0" y="1222.88" fill="#3267A4" font-size="32" font-weight="400" text-anchor="middle">Append</text><text x="360" y="1289.28" fill="#606C7B" font-size="24" font-weight="400" text-anchor="middle"><tspan x="360" dy="0">Same architecture: training updates weights; generation adds</tspan><tspan x="360" dy="25.92">text.</tspan></text></g></svg>