<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1980" viewBox="0 0 720 1320" role="img" aria-label="New data needs new training" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1250" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">New data needs new training</text><text x="36" y="110" fill="#606C7B" font-size="28.23" font-weight="400" text-anchor="start">Real test · same initial weights · 1000 pretrain steps</text><text x="36" y="182" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">Both inputs: 早上，小丁喜欢</text><rect x="36" y="244" width="282" height="96" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2" /><text x="177.0" y="289.99" fill="#8056A5" font-size="24.32" font-weight="400" text-anchor="middle"><tspan x="177.0" dy="0">Original pretrained</tspan><tspan x="177.0" dy="26.2656">weights</tspan></text><path d="M330 292 L379 292" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><text x="406" y="306" fill="#187B79" font-size="36" font-weight="600" text-anchor="start">红色的苹果。</text><text x="36" y="394" fill="#606C7B" font-size="29.56" font-weight="400" text-anchor="start">Editing data leaves saved parameters unchanged</text><path d="M36 438 L684 438" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="36" y="500" fill="#3267A4" font-size="36" font-weight="600" text-anchor="start">Swapped training facts</text><text x="36" y="562" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">小丁 → 黄色的香蕉</text><text x="36" y="614" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">小周 → 红色的苹果</text><path d="M178 636 L178 689" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)" /><rect x="36" y="705" width="282" height="96" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2" /><text x="177.0" y="765.24" fill="#B14C70" font-size="36" font-weight="400" text-anchor="middle">Retrain</text><text x="365" y="742" fill="#B14C70" font-size="27.52" font-weight="400" text-anchor="start">New targets give gradients</text><text x="365" y="790" fill="#B14C70" font-size="27.66" font-weight="400" text-anchor="start">Optimizer updates weights</text><path d="M178 815 L178 867" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)" /><rect x="36" y="885" width="282" height="96" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2" /><text x="177.0" y="943.88" fill="#8056A5" font-size="24.6" font-weight="400" text-anchor="middle">New pretrained weights</text><path d="M330 933 L379 933" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)" /><text x="406" y="947" fill="#187B79" font-size="36" font-weight="600" text-anchor="start">黄色的香蕉。</text><text x="36" y="1040" fill="#187B79" font-size="29.02" font-weight="400" text-anchor="start">Now the same prompt gets a different continuation</text><path d="M36 1080 L684 1080" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="36" y="1140" fill="#222A35" font-size="29.55" font-weight="400" text-anchor="start">Still 79 vocabulary tokens and 92,352 parameters</text><text x="36" y="1196" fill="#606C7B" font-size="26.45" font-weight="400" text-anchor="start">Parameter values change; network size stays the same</text></g><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="0" y="1250" width="720" height="70" fill="white" /><text x="360" y="1293.4" font-size="24" fill="#606C7B" text-anchor="middle">Chinese text is kept from the original example.</text></g></svg>