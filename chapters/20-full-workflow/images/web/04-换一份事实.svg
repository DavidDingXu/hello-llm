<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="832" viewBox="0 0 1504 832" role="img" aria-label="改了数据，旧答案不会自动变" data-web-layout="two-panels" data-source-viewbox="0 0 720 1250"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B"/></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4"/></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5"/></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79"/></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7"/></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9"/></marker></defs><rect width="1504" height="832" fill="white"/><g font-family="'Hiragino Sans GB','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">改了数据，旧答案不会自动变</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">实际实验：同一初值，重做1000步预训练</text><text x="1468" y="60" fill="#606C7B" font-size="24" text-anchor="end">从左向右阅读 ① → ②</text><g transform="translate(0,54)"><text x="36" y="182" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">两次都输入：早上，小丁喜欢</text><rect x="36" y="244" width="282" height="96" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2"/><text x="177.0" y="302.88" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">原预训练权重</text><path d="M330 292 L379 292" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)"/><text x="406" y="306" fill="#187B79" font-size="36" font-weight="600" text-anchor="start">红色的苹果。</text><text x="36" y="394" fill="#606C7B" font-size="32" font-weight="400" text-anchor="start">只改数据，已保存的参数不会跟着变</text><path d="M36 438 L684 438" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="36" y="500" fill="#3267A4" font-size="36" font-weight="600" text-anchor="start">交换后的训练事实</text><text x="36" y="562" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">小丁 → 黄色的香蕉</text><text x="36" y="614" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">小周 → 红色的苹果</text></g><text x="36" y="157" fill="#187B79" font-size="28" font-weight="600">①</text><g transform="translate(784,-442)"><path d="M178 636 L178 689" fill="none" stroke="#3267A4" stroke-width="3" marker-end="url(#a-input)"/><rect x="36" y="705" width="282" height="96" rx="12" fill="#FFFFFF" stroke="#B14C70" stroke-width="2"/><text x="177.0" y="765.24" fill="#B14C70" font-size="36" font-weight="400" text-anchor="middle">重新训练</text><text x="365" y="742" fill="#B14C70" font-size="30" font-weight="400" text-anchor="start">新目标产生梯度</text><text x="365" y="790" fill="#B14C70" font-size="30" font-weight="400" text-anchor="start">优化器调整参数</text><path d="M178 815 L178 867" fill="none" stroke="#B14C70" stroke-width="3" marker-end="url(#a-grad)"/><rect x="36" y="885" width="282" height="96" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2"/><text x="177.0" y="943.88" fill="#8056A5" font-size="32" font-weight="400" text-anchor="middle">新预训练权重</text><path d="M330 933 L379 933" fill="none" stroke="#8056A5" stroke-width="3" marker-end="url(#a-param)"/><text x="406" y="947" fill="#187B79" font-size="36" font-weight="600" text-anchor="start">黄色的香蕉。</text><text x="36" y="1040" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">再用开头同一句输入，接续才改变</text><path d="M36 1080 L684 1080" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="36" y="1140" fill="#222A35" font-size="32" font-weight="400" text-anchor="start">词表仍为79项，参数仍为92,352个</text><text x="36" y="1196" fill="#606C7B" font-size="32" font-weight="400" text-anchor="start">改变的是参数的数值，网络尺寸不变</text></g><text x="820" y="157" fill="#187B79" font-size="28" font-weight="600">②</text><line x1="752" y1="140" x2="752" y2="812" stroke="#DDE2E8" stroke-width="1"/></g></svg>