<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2160" viewBox="0 0 720 1440" role="img" aria-label="What will you build?" lang="en"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B" /></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4" /></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5" /></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79" /></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7" /></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9" /></marker></defs><rect width="720" height="1370" fill="white" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">What will you build?</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">One network, trained in two stages.</text><text x="36" y="176" fill="#222A35" font-size="36" font-weight="600" text-anchor="start">After pretraining: continue a sentence</text><text x="60" y="241" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">You enter</text><rect x="48" y="264" width="624" height="80" rx="12" fill="#FFFFFF" stroke="#3267A4" stroke-width="2" /><text x="360.0" y="316.92" fill="#3267A4" font-size="38" font-weight="400" text-anchor="middle">早上，小丁喜欢</text><path d="M360 350 L360 381" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)" /><rect x="112" y="390" width="496" height="80" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="442.24" fill="#8056A5" font-size="27.71" font-weight="400" text-anchor="middle">Compute scores, then choose a token</text><path d="M360 477 L360 510" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><rect x="73" y="522" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="120.0" y="574.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">红</text><rect x="169" y="522" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="216.0" y="574.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">色</text><rect x="265" y="522" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="312.0" y="574.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">的</text><rect x="361" y="522" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="408.0" y="574.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">苹</text><rect x="457" y="522" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="504.0" y="574.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">果</text><rect x="553" y="522" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="600.0" y="574.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">。</text><text x="360" y="648" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">Select one token, append it, and repeat</text><text x="36" y="752" fill="#222A35" font-size="33.08" font-weight="600" text-anchor="start">After Q&amp;A fine-tuning: answer a question</text><text x="60" y="817" fill="#3267A4" font-size="32" font-weight="400" text-anchor="start">You enter</text><rect x="48" y="840" width="624" height="126" rx="8" fill="#F2F6FB" stroke="none" stroke-width="2" /><text x="68" y="887" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">问：小丁喜欢什么水果？</text><text x="68" y="934" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">答：</text><path d="M360 972 L360 1003" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)" /><rect x="112" y="1012" width="496" height="80" rx="12" fill="#FFFFFF" stroke="#8056A5" stroke-width="2" /><text x="360.0" y="1064.24" fill="#8056A5" font-size="27.71" font-weight="400" text-anchor="middle">Compute scores, then choose a token</text><path d="M360 1099 L360 1132" fill="none" stroke="#187B79" stroke-width="3" marker-end="url(#a-output)" /><rect x="73" y="1144" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="120.0" y="1196.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">红</text><rect x="169" y="1144" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="216.0" y="1196.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">色</text><rect x="265" y="1144" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="312.0" y="1196.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">的</text><rect x="361" y="1144" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="408.0" y="1196.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">苹</text><rect x="457" y="1144" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="504.0" y="1196.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">果</text><rect x="553" y="1144" width="94" height="76" rx="12" fill="#FFFFFF" stroke="#187B79" stroke-width="2" /><text x="600.0" y="1196.28" fill="#187B79" font-size="42" font-weight="400" text-anchor="middle">。</text><text x="360" y="1270" fill="#187B79" font-size="32" font-weight="400" text-anchor="middle">Select one token, append it, and repeat</text><path d="M36 688 L684 688" fill="none" stroke="#C5CDD7" stroke-width="2" /><text x="360" y="1325" fill="#606C7B" font-size="30" font-weight="400" text-anchor="middle">Real outputs; unfamiliar wording can still fail.</text></g><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="0" y="1370" width="720" height="70" fill="white" /><text x="360" y="1413.4" font-size="24" fill="#606C7B" text-anchor="middle">Chinese text is kept from the original example.</text></g></svg>