<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1280" viewBox="0 0 1080 1280" aria-label="What do you want to change?" lang="en"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#606C7B" /></marker></defs><rect width="1080" height="1280" fill="#FFFFFF" /><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#222A35"><text x="60" y="105" font-size="54" font-weight="650">What do you want to change?</text><text x="60" y="205" font-size="46" font-weight="600" fill="#3267A4">Put information in the input</text><path d="M60 255 H390 L425 290 V475 H60 Z" fill="white" stroke="#3267A4" stroke-width="3" /><text x="95" y="337" font-size="42">Product manual</text><text x="95" y="414" font-size="42">+ this question</text><path d="M462 364 H615" stroke="#606C7B" stroke-width="4" marker-end="url(#a)" /><rect x="660" y="255" width="360" height="220" rx="16" fill="white" stroke="#8056A5" stroke-width="3" /><text x="707" y="335" font-size="46">Model</text><text x="707" y="414" font-size="42" fill="#8056A5">Fixed weights</text><text x="60" y="554" font-size="38" fill="#606C7B">Change what the model can read this time</text><path d="M60 615 H1020" stroke="#C5CDD7" stroke-width="2" /><text x="60" y="718" font-size="46" font-weight="600" fill="#8056A5">Fine-tune on examples</text><path d="M60 768 H390 L425 803 V988 H60 Z" fill="white" stroke="#8056A5" stroke-width="3" /><text x="95" y="848" font-size="42">Q&amp;A examples</text><text x="95" y="927" font-size="42">For training</text><path d="M462 877 H615" stroke="#606C7B" stroke-width="4" marker-end="url(#a)" /><rect x="660" y="768" width="360" height="220" rx="16" fill="white" stroke="#8056A5" stroke-width="3" /><text x="707" y="848" font-size="46">Model</text><text x="707" y="927" font-size="42" fill="#8056A5">Update weights</text><text x="60" y="1067" font-size="38" fill="#606C7B">Training targets guide parameter updates</text><text x="60" y="1184" font-size="40" fill="#187B79">Different things change, so diagnosis differs too.</text></g></svg>