<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="1516.96" viewBox="0 0 1504 1516.96" role="img" aria-label="A language model in 20 lessons" lang="en" data-web-layout="two-panels" data-source-viewbox="0 0 720 2658"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222A35"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#606C7B"/></marker><marker id="a-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3267A4"/></marker><marker id="a-param" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8056A5"/></marker><marker id="a-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#187B79"/></marker><marker id="a-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B14C70"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C5CDD7"/></marker><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F4F6F9"/></marker></defs><rect width="1504" height="1516.96" fill="white"/><g font-family="Arial,'Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-variant-numeric="tabular-nums"><text x="36" y="60" fill="#222A35" font-size="40" font-weight="600" text-anchor="start">A language model in 20 lessons</text><text x="36" y="110" fill="#606C7B" font-size="30" font-weight="400" text-anchor="start">Four stages, one continuous project.</text><text x="1468" y="60" fill="#606C7B" font-size="24" text-anchor="end">Read 1 → 2</text><g transform="translate(0,54)"><text x="36" y="175" fill="#606C7B" font-size="28" font-weight="400" text-anchor="start">Stage 1</text><text x="684" y="175" fill="#606C7B" font-size="28" font-weight="400" text-anchor="end">Lessons 01–06</text><text x="36" y="227" fill="#222A35" font-size="38" font-weight="600" text-anchor="start">Make a numeric network learn</text><path d="M36 248 L684 248" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="40" y="294" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">01</text><text x="116" y="294" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Neuron</text><text x="40" y="352" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">02</text><text x="116" y="352" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Vectors / matrices</text><text x="40" y="410" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">03</text><text x="116" y="410" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Nonlinearity</text><text x="40" y="468" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">04</text><text x="116" y="468" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Gradients</text><text x="40" y="526" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">05</text><text x="116" y="526" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Backpropagation</text><text x="40" y="584" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">06</text><text x="116" y="584" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Training loop</text><rect x="36" y="626" width="648" height="142" rx="8" fill="#F2F7F6" stroke="none" stroke-width="2"/><text x="58" y="661" fill="#187B79" font-size="28" font-weight="600" text-anchor="start">What you build</text><text x="58" y="706" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">Compute gradients; update weights</text><text x="58" y="749" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">Teach a small network four rules</text><path d="M360 783 L360 813" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><text x="36" y="867" fill="#606C7B" font-size="28" font-weight="400" text-anchor="start">Stage 2</text><text x="684" y="867" fill="#606C7B" font-size="28" font-weight="400" text-anchor="end">Lessons 07–09</text><text x="36" y="919" fill="#222A35" font-size="38" font-weight="600" text-anchor="start">Connect text to the network</text><path d="M36 940 L684 940" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="40" y="986" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">07</text><text x="116" y="986" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Embedding</text><text x="40" y="1044" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">08</text><text x="116" y="1044" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Softmax</text><text x="40" y="1102" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">09</text><text x="116" y="1102" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Training targets</text><rect x="36" y="1144" width="648" height="142" rx="8" fill="#F2F7F6" stroke="none" stroke-width="2"/><text x="58" y="1179" fill="#187B79" font-size="28" font-weight="600" text-anchor="start">What you build</text><text x="58" y="1224" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">Build a character-prediction baseline</text><text x="58" y="1267" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">See its lack of access to context</text><path d="M360 1301 L360 1331" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/></g><text x="36" y="157" fill="#187B79" font-size="28" font-weight="600">①</text><g transform="translate(784,-1165.04)"><text x="36" y="1385" fill="#606C7B" font-size="28" font-weight="400" text-anchor="start">Stage 3</text><text x="684" y="1385" fill="#606C7B" font-size="28" font-weight="400" text-anchor="end">Lessons 10–16</text><text x="36" y="1437" fill="#222A35" font-size="38" font-weight="600" text-anchor="start">Read context; assemble the model</text><path d="M36 1458 L684 1458" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="40" y="1504" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">10</text><text x="116" y="1504" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Attention</text><text x="40" y="1562" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">11</text><text x="116" y="1562" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Causal masking</text><text x="40" y="1620" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">12</text><text x="116" y="1620" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Multi-head attention</text><text x="40" y="1678" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">13</text><text x="116" y="1678" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">RoPE</text><text x="40" y="1736" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">14</text><text x="116" y="1736" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">SwiGLU</text><text x="40" y="1794" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">15</text><text x="116" y="1794" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Residuals / RMSNorm</text><text x="40" y="1852" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">16</text><text x="116" y="1852" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Complete model</text><rect x="36" y="1894" width="648" height="142" rx="8" fill="#F2F7F6" stroke="none" stroke-width="2"/><text x="58" y="1929" fill="#187B79" font-size="28" font-weight="600" text-anchor="start">What you build</text><text x="58" y="1974" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">Implement and assemble each component</text><text x="58" y="2017" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">Trace one real forward pass</text><path d="M360 2051 L360 2081" fill="none" stroke="#C5CDD7" stroke-width="3" marker-end="url(#a-line)"/><text x="36" y="2135" fill="#606C7B" font-size="28" font-weight="400" text-anchor="start">Stage 4</text><text x="684" y="2135" fill="#606C7B" font-size="28" font-weight="400" text-anchor="end">Lessons 17–20</text><text x="36" y="2187" fill="#222A35" font-size="38" font-weight="600" text-anchor="start">Train, generate, and fine-tune</text><path d="M36 2208 L684 2208" fill="none" stroke="#C5CDD7" stroke-width="2"/><text x="40" y="2254" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">17</text><text x="116" y="2254" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Pretraining</text><text x="40" y="2312" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">18</text><text x="116" y="2312" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Generation</text><text x="40" y="2370" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">19</text><text x="116" y="2370" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Supervised fine-tuning</text><text x="40" y="2428" fill="#3267A4" font-size="34" font-weight="400" text-anchor="start">20</text><text x="116" y="2428" fill="#222A35" font-size="36" font-weight="400" text-anchor="start">Full workflow</text><rect x="36" y="2470" width="648" height="142" rx="8" fill="#F2F7F6" stroke="none" stroke-width="2"/><text x="58" y="2505" fill="#187B79" font-size="28" font-weight="600" text-anchor="start">What you build</text><text x="58" y="2550" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">From random weights to text and Q&amp;A</text><text x="58" y="2593" fill="#187B79" font-size="32" font-weight="400" text-anchor="start">Debug with controls; transfer to new data</text></g><text x="820" y="157" fill="#187B79" font-size="28" font-weight="600">②</text><line x1="752" y1="140" x2="752" y2="1496.96" stroke="#DDE2E8" stroke-width="1"/></g></svg>